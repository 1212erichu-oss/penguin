<!doctype html>
<html><head><meta charset="utf-8"><title>Penguin Login</title><link rel="stylesheet" href="style.css"></head>
<body><h1>🐧 Penguin Learning</h1><div class="card"><p>This static version saves progress in this browser.</p>
<form id="loginForm"><input id="username" required maxlength="30" placeholder="Choose a username"><button>Enter</button></form></div>
<script src="app.js"></script><script>
document.getElementById("loginForm").addEventListener("submit", event => { event.preventDefault(); const name = document.getElementById("username").value.trim(); if (!name) return; const user = getUser(name); saveUser(user); window.location.href = "home.html"; });
</script></body></html>
