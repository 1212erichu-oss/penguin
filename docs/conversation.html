<!doctype html>
<html><head><meta charset="utf-8"><title>Conversation Mode</title><link rel="stylesheet" href="style.css"></head>
<body><h1>🗣️ Conversation Mode</h1><div class="card"><input id="language" placeholder="Spanish, French, or Japanese"><select id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select><button id="start">Start Conversation</button></div><div id="prompts" class="card"></div><button id="submit">Submit Responses</button><div id="results" class="card"></div><a href="home.html"><button>🏠 Home</button></a>
<script src="app.js"></script><script>
requireUser(); const promptBank = { Spanish: [{english:"Hello, how are you?", target:"Hola, ¿cómo estás?"},{english:"My name is Alex.", target:"Me llamo Alex."},{english:"I like penguins.", target:"Me gustan los pingüinos."}], French: [{english:"Hello, how are you?", target:"Bonjour, comment allez-vous ?"},{english:"My name is Alex.", target:"Je m'appelle Alex."},{english:"I like penguins.", target:"J'aime les pingouins."}], Japanese: [{english:"Hello, how are you?", target:"Konnichiwa, ogenki desu ka?"},{english:"My name is Alex.", target:"Watashi no namae wa Alex desu."},{english:"I like penguins.", target:"Watashi wa pengin ga suki desu."}] }; let prompts = [];
document.getElementById("start").onclick = () => { const typed = document.getElementById("language").value.trim(); const key = Object.keys(promptBank).find(k => k.toLowerCase() === typed.toLowerCase()) || "Spanish"; prompts = promptBank[key]; document.getElementById("prompts").innerHTML = prompts.map((p,i) => `<div class="question"><b>${i+1}. ${p.english}</b><br><textarea id="answer${i}" rows="3" cols="45" placeholder="Type your translation"></textarea></div>`).join(""); };
document.getElementById("submit").onclick = () => { if (!prompts.length) return; const results = prompts.map((p,i) => { const answer = document.getElementById(`answer${i}`).value.trim(); const score = answer ? 10 : 0; return `<p><b>Question ${i+1}: ${score}/10</b><br>Expected: ${escapeHtml(p.target)}<br>${answer ? "Nice effort! Compare your answer with the example." : "Try answering next time."}</p>`; }); const user = getUser(); const earned = prompts.filter((_,i) => document.getElementById(`answer${i}`).value.trim()).length * 2; user.xp += earned; user.level = Math.floor(user.xp / 20) + 1; saveUser(user); document.getElementById("results").innerHTML = results.join("") + `<b>XP earned: ${earned}</b>`; };
</script></body></html>
