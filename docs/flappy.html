<!doctype html>
<html><head><meta charset="utf-8"><title>Flappy Penguins</title><link rel="stylesheet" href="style.css"></head>
<body><h1>🐧 Flappy Penguins</h1><p>A relaxing mini game to chill with after a study session.</p><canvas id="game" width="400" height="500"></canvas><br><button onclick="restart()">Restart</button><a href="home.html"><button>Home</button></a><p id="score">Score: 0</p>
<script src="app.js"></script><script>
requireUser(); const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"); let penguin,pipes,score,gameOver; const gravity=.12,jumpPower=-4,penguinSize=34,minGap=penguinSize*4,pipeWidth=36,pipeSpeed=2,pipeSpacing=180; function start(){penguin={x:80,y:200,w:penguinSize,h:penguinSize,vel:0};pipes=[];score=0;gameOver=false;document.getElementById("score").textContent="Score: 0";spawnPipe()} function spawnPipe(){const margin=150,top=Math.random()*(canvas.height-minGap-margin*2)+margin;pipes.push({x:canvas.width,w:pipeWidth,top,bottom:top+minGap,passed:false})} function update(){if(gameOver)return;penguin.vel+=gravity;penguin.y+=penguin.vel;if(penguin.y>canvas.height)gameOver=true;if(penguin.y<0)penguin.y=0;pipes.forEach(p=>{p.x-=pipeSpeed;if(!p.passed&&p.x<penguin.x){p.passed=true;score++;document.getElementById("score").textContent="Score: "+score}if(penguin.x<p.x+p.w&&penguin.x+penguin.w>p.x&&(penguin.y<p.top||penguin.y+penguin.h>p.bottom))gameOver=true});pipes=pipes.filter(p=>p.x+p.w>0);const last=pipes[pipes.length-1];if(last&&last.x<canvas.width-pipeSpacing)spawnPipe()} function drawPenguin(){ctx.fillStyle="black";ctx.beginPath();ctx.arc(penguin.x+17,penguin.y+17,17,0,Math.PI*2);ctx.fill();ctx.fillStyle="white";ctx.beginPath();ctx.arc(penguin.x+17,penguin.y+20,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(penguin.x+22,penguin.y+12,4,0,Math.PI*2);ctx.fill();ctx.fillStyle="black";ctx.beginPath();ctx.arc(penguin.x+23,penguin.y+12,2,0,Math.PI*2);ctx.fill();ctx.fillStyle="orange";ctx.beginPath();ctx.moveTo(penguin.x+30,penguin.y+18);ctx.lineTo(penguin.x+38,penguin.y+21);ctx.lineTo(penguin.x+30,penguin.y+24);ctx.fill()} function drawPipe(x,y,w,h){ctx.fillStyle="#c8f1ff";ctx.fillRect(x,y,w,h)} function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawPenguin();pipes.forEach(p=>{drawPipe(p.x,0,p.w,p.top);drawPipe(p.x,p.bottom,p.w,canvas.height-p.bottom)});if(gameOver){ctx.fillStyle="red";ctx.font="32px Arial";ctx.fillText("Game Over",120,250)}} function loop(t){update();draw();requestAnimationFrame(loop)} document.addEventListener("keydown",e=>{if(e.code==="Space"&&!gameOver)penguin.vel=jumpPower});canvas.addEventListener("mousedown",()=>{if(!gameOver)penguin.vel=jumpPower});function restart(){start()} start();requestAnimationFrame(loop);
</script></body></html>
