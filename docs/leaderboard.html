<!doctype html>
<html><head><meta charset="utf-8"><title>Leaderboard</title><link rel="stylesheet" href="style.css"></head>
<body><h1>🏆 Leaderboard</h1><table><thead><tr><th>Penguin</th><th>Username</th><th>Score</th><th>XP</th><th>Level</th></tr></thead><tbody id="body"></tbody></table><a href="home.html"><button>🏠 Home</button></a><a href="penguin.html"><button>🐧 My Penguin</button></a>
<script src="app.js"></script><script>const users = allUsers().sort((a,b) => b.level - a.level || b.xp - a.xp); document.getElementById("body").innerHTML = users.length ? users.map(u => `<tr><td>${u.color || "#000000"}</td><td>${escapeHtml(u.username)}</td><td>${u.score}</td><td>${u.xp}</td><td>${u.level}</td></tr>`).join("") : `<tr><td colspan="5">No players yet.</td></tr>`;</script></body></html>
