<!doctype html>
<html><head><meta charset="utf-8"><title>My Penguin</title><link rel="stylesheet" href="style.css"></head>
<body><h1>🐧 My Penguin</h1><div class="penguin"><div class="body"></div><div class="belly"></div><div class="eye left"></div><div class="eye right"></div><div class="beak"></div></div><p>Level: <span id="level"></span></p><div class="card"><p>Choose Penguin Color</p><input type="color" id="color"><br><button id="apply">Apply Color</button><button id="pet">🐧 Pet Penguin</button><button id="talk">💬 Talk</button><p id="response"></p></div><a href="home.html"><button>🏠 Home</button></a>
<script src="app.js"></script><script>const user = requireUser(); const body = document.querySelector(".penguin .body"); document.getElementById("level").textContent = user.level; document.getElementById("color").value = user.color || "#000000"; body.style.background = user.color || "#000000"; document.getElementById("apply").onclick = () => { user.color = document.getElementById("color").value; body.style.background = user.color; saveUser(user); }; document.getElementById("pet").onclick = () => document.getElementById("response").textContent = "Your penguin is happy! 🐧"; document.getElementById("talk").onclick = () => document.getElementById("response").textContent = "Penguins can swim faster than they walk! 🐧";</script></body></html>
